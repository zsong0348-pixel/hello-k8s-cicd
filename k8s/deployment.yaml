apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-k8s
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-k8s
  template:
    metadata:
      labels:
        app: hello-k8s
    spec:
      containers:
        - name: hello-k8s
          image: ghcr.io/zsong0348-pixel/hello-k8s:1f7a1764dda9d44d0d24b1437e324a1fc8561151
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1f7a1764dda9d44d0d24b1437e324a1fc8561151"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
